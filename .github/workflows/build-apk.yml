
name: Build GROW CAPITAL APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android Platform
        run: flutter create --platforms=android --org com.arish --project-name grow_capital .

      - name: Configure Firebase
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = Path("android/settings.gradle.kts")
          app = Path("android/app/build.gradle.kts")

          if not settings.exists() or not app.exists():
              raise SystemExit("Android Gradle files not found")

          s = settings.read_text()
          a = app.read_text()

          if "com.google.gms.google-services" not in s:
              match = re.search(r'plugins\s*\{', s)
              if not match:
                  raise SystemExit("Settings plugins block not found")
              pos = match.end()
              line = '\n    id("com.google.gms.google-services") version "4.4.2" apply false'
              s = s[:pos] + line + s[pos:]
              settings.write_text(s)

          if "com.google.gms.google-services" not in a:
              match = re.search(r'plugins\s*\{', a)
              if not match:
                  raise SystemExit("App plugins block not found")
              pos = match.end()
              line = '\n    id("com.google.gms.google-services")'
              a = a[:pos] + line + a[pos:]
              app.write_text(a)

          if not Path("android/app/google-services.json").exists():
              raise SystemExit("google-services.json is missing")

          print("Firebase Gradle configuration completed.")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Get SHA fingerprints
        run: |
          cd android
          ./gradlew signingReport

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: grow-capital-apk
          path: build/app/outputs/flutter-apk/app-release.apk
