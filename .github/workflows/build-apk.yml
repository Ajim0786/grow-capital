
name: Build GROW CAPITAL APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android Platform
        run: flutter create --platforms=android --org com.arish --project-name growcapital .

      - name: Configure Firebase
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = Path("android/settings.gradle.kts")
          app = Path("android/app/build.gradle.kts")

          s = settings.read_text()
          a = app.read_text()

          if "com.google.gms.google-services" not in s:
              match = re.search(r"plugins\s*\{", s)
              if not match:
                  raise SystemExit("Settings plugins block not found")
              pos = match.end()
              s = s[:pos] + '\n    id("com.google.gms.google-services") version "4.4.2" apply false' + s[pos:]
              settings.write_text(s)

          if "com.google.gms.google-services" not in a:
              match = re.search(r"plugins\s*\{", a)
              if not match:
                  raise SystemExit("App plugins block not found")
              pos = match.end()
              a = a[:pos] + '\n    id("com.google.gms.google-services")' + a[pos:]
              app.write_text(a)

          if not Path("android/app/google-services.json").exists():
              raise SystemExit("google-services.json is missing")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Disable Plugin Lint Tasks
        run: |
          cat >> android/build.gradle.kts <<'EOF'

          subprojects {
              if (name == "image_picker_android") {
                  tasks.configureEach {
                      if (name.contains("lint", ignoreCase = true)) {
                          enabled = false
                      }
                  }
              }
          }
          EOF

      - name: Get SHA fingerprints
        run: |
          cd android
          ./gradlew signingReport

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: grow-capital-apk
          path: build/app/outputs/flutter-apk/app-release.apk
