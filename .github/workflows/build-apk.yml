name: Build GROW CAPITAL APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android Platform
        run: flutter create --platforms=android --project-name grow_capital .

      - name: Configure Firebase
        run: |
          if [ -f android/settings.gradle.kts ]; then
            sed -i '/^plugins {/a\    id("com.google.gms.google-services") version "4.4.2" apply false' android/settings.gradle.kts
            sed -i '/^plugins {/a\    id("com.google.gms.google-services")' android/app/build.gradle.kts
          elif [ -f android/settings.gradle ]; then
            sed -i '/^plugins {/a\    id "com.google.gms.google-services" version "4.4.2" apply false' android/settings.gradle
            sed -i '/^plugins {/a\    id "com.google.gms.google-services"' android/app/build.gradle
          else
            echo "Gradle settings file not found"
            exit 1
          fi
          test -f android/app/google-services.json

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: grow-capital-apk
          path: build/app/outputs/flutter-apk/app-release.apk
